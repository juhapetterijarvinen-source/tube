<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iOS7 Tube">
<title>iOS7 Tube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: #f4eff8;
    color: #111;
    -webkit-text-size-adjust: none;
  }
  .top-bar {
    background-color: #6a1b9a;
    color: #fff;
    padding: 10px 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.4px;
  }
  .nav-tabs {
    display: -webkit-flex;
    display: flex;
  }
  .nav-btn {
    background-color: rgba(255, 255, 255, 0.18);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    margin-left: 6px;
    border-radius: 6px;
  }
  .nav-btn.active {
    background-color: #fff;
    color: #6a1b9a;
    border-color: #fff;
  }
  .search-wrapper.centered {
    padding: 75px 18px 20px 18px;
    text-align: center;
  }
  .search-wrapper.compact {
    background-color: #7b1fa2;
    padding: 10px 12px;
  }
  .search-box {
    display: -webkit-flex;
    display: flex;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 3px 10px rgba(74, 20, 140, 0.18);
    border-radius: 8px;
  }
  input[type="text"] {
    -webkit-flex: 1;
    flex: 1;
    font-size: 19px;
    padding: 14px 12px;
    border: 2px solid #8e24aa;
    border-right: none;
    border-radius: 8px 0 0 8px;
    outline: none;
    background-color: #fff;
    color: #111;
  }
  .compact input[type="text"] {
    font-size: 17px;
    padding: 10px 12px;
    border: none;
  }
  button.search-btn {
    background-color: #8e24aa;
    color: #fff;
    border: 2px solid #8e24aa;
    padding: 14px 18px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 0 8px 8px 0;
  }
  .compact button.search-btn {
    background-color: #4a148c;
    border: none;
    padding: 10px 16px;
    font-size: 16px;
  }
  button.search-btn:active {
    background-color: #4a148c;
  }
  #status {
    padding: 14px 18px;
    text-align: center;
    font-size: 15px;
    color: #5e35b1;
    line-height: 1.4;
  }
  /* Natiivi videokehys ja upotuskehys */
  #playerBox {
    display: none;
    background-color: #000;
    text-align: center;
    padding-bottom: 10px;
  }
  #nowPlayingText {
    color: #e1bee7;
    font-size: 13px;
    padding: 6px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #nativePlayer {
    width: 100%;
    max-height: 210px;
    background-color: #000;
  }
  #embedPlayer {
    display: none;
    width: 100%;
    height: 220px;
    border: none;
    background-color: #000;
  }
  .player-controls {
    margin-top: 6px;
  }
  .player-btn {
    background-color: #6a1b9a;
    color: #fff;
    border: none;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    margin: 0 4px;
  }
  /* Videorivi */
  .video-item {
    background-color: #fff;
    border-bottom: 1px solid #e1d5ec;
    padding: 10px;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
  }
  .video-click-area {
    -webkit-flex: 1;
    flex: 1;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    overflow: hidden;
  }
  .video-click-area:active {
    opacity: 0.7;
  }
  .thumb {
    width: 96px;
    height: 54px;
    background-color: #1a002b;
    margin-right: 10px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 4px;
  }
  .info {
    -webkit-flex: 1;
    flex: 1;
    overflow: hidden;
    padding-right: 6px;
  }
  .v-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
    line-height: 1.25;
    max-height: 35px;
    overflow: hidden;
  }
  .v-meta {
    font-size: 12px;
    color: #6a1b9a;
  }
  .add-btn {
    background-color: #f3e5f5;
    color: #6a1b9a;
    border: 1px solid #ce93d8;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .add-btn:active {
    background-color: #8e24aa;
    color: #fff;
  }
  /* Soittolistanäkymä */
  #playlistsView {
    display: none;
    padding-bottom: 20px;
  }
  .pl-header {
    background-color: #7b1fa2;
    color: #fff;
    padding: 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .pl-card {
    background-color: #fff;
    border-bottom: 1px solid #e1d5ec;
    padding: 14px 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .pl-name {
    font-size: 16px;
    font-weight: bold;
    color: #4a148c;
  }
  .pl-count {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }
  .btn-play-pl {
    background-color: #8e24aa;
    color: #fff;
    border: none;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
    margin-right: 6px;
  }
  .btn-del {
    background-color: #fbe9e7;
    color: #c62828;
    border: 1px solid #ef9a9a;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
  }
  /* Ponnahdusikkuna soittolistan valintaan */
  #modalOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.65);
    z-index: 100;
    padding: 30px 16px;
  }
  .modal-box {
    background-color: #fff;
    border-radius: 10px;
    max-width: 380px;
    margin: 20px auto;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .modal-title {
    font-size: 16px;
    font-weight: bold;
    color: #4a148c;
    margin-bottom: 12px;
  }
  .modal-list-item {
    padding: 12px;
    border: 1px solid #e1d5ec;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #6a1b9a;
    background-color: #faf5fc;
  }
  .modal-list-item:active {
    background-color: #e1bee7;
  }
  .modal-new-btn {
    width: 100%;
    padding: 12px;
    background-color: #8e24aa;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    margin-top: 4px;
  }
  .modal-cancel-btn {
    width: 100%;
    padding: 10px;
    background-color: #eee;
    color: #333;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">iOS7 Tube</div>
  <div class="nav-tabs">
    <button type="button" id="tabSearch" class="nav-btn active" onclick="switchTab('search')">Haku</button>
    <button type="button" id="tabPlaylists" class="nav-btn" onclick="switchTab('playlists')">Soittolistat</button>
  </div>
</div>

<!-- Sivun sisäinen natiivi videosoitin ja upotussoitin -->
<div id="playerBox">
  <div id="nowPlayingText"></div>
  <video id="nativePlayer" controls preload="auto"></video>
  <iframe id="embedPlayer" allowfullscreen></iframe>
  <div class="player-controls">
    <button type="button" id="nextTrackBtn" class="player-btn" style="display:none;" onclick="playNextInQueue()">Seuraava &raquo;</button>
    <button type="button" class="player-btn" onclick="closePlayer()">Sulje soitin</button>
  </div>
</div>

<!-- HAKUNÄKYMÄ -->
<div id="searchView">
  <div id="searchWrapper" class="search-wrapper centered">
    <form class="search-box" onsubmit="doSearch(); return false;">
      <input type="text" id="queryInput" placeholder="Hae videoita..." autocomplete="off">
      <button type="submit" class="search-btn">Hae</button>
    </form>
    <div id="status">Kirjoita hakusana ja paina Hae.</div>
  </div>
  <div id="results"></div>
</div>

<!-- SOITTOLISTANÄKYMÄ -->
<div id="playlistsView">
  <div class="pl-header">
    <div id="plHeaderTitle" style="font-weight:bold; font-size:16px;">Omat soittolistat</div>
    <div>
      <button type="button" id="plBackBtn" class="nav-btn" style="display:none;" onclick="renderPlaylistsOverview()">&laquo; Takaisin</button>
      <button type="button" id="plCreateBtn" class="nav-btn active" onclick="createNewPlaylistPrompt()">+ Uusi lista</button>
    </div>
