<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iOS7 Tube">
<title>iOS7 Tube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: #f4eff8;
    color: #111;
    -webkit-text-size-adjust: none;
  }
  .top-bar {
    background-color: #6a1b9a;
    color: #fff;
    padding: 10px 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.4px;
  }
  .nav-tabs {
    display: -webkit-flex;
    display: flex;
  }
  .nav-btn {
    background-color: rgba(255, 255, 255, 0.18);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    margin-left: 6px;
    border-radius: 6px;
  }
  .nav-btn.active {
    background-color: #fff;
    color: #6a1b9a;
    border-color: #fff;
  }
  .search-wrapper.centered {
    padding: 75px 18px 20px 18px;
    text-align: center;
  }
  .search-wrapper.compact {
    background-color: #7b1fa2;
    padding: 10px 12px;
  }
  .search-box {
    display: -webkit-flex;
    display: flex;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 3px 10px rgba(74, 20, 140, 0.18);
    border-radius: 8px;
  }
  input[type="text"] {
    -webkit-flex: 1;
    flex: 1;
    font-size: 19px;
    padding: 14px 12px;
    border: 2px solid #8e24aa;
    border-right: none;
    border-radius: 8px 0 0 8px;
    outline: none;
    background-color: #fff;
    color: #111;
  }
  .compact input[type="text"] {
    font-size: 17px;
    padding: 10px 12px;
    border: none;
  }
  button.search-btn {
    background-color: #8e24aa;
    color: #fff;
    border: 2px solid #8e24aa;
    padding: 14px 18px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 0 8px 8px 0;
  }
  .compact button.search-btn {
    background-color: #4a148c;
    border: none;
    padding: 10px 16px;
    font-size: 16px;
  }
  button.search-btn:active {
    background-color: #4a148c;
  }
  #status {
    padding: 14px 18px;
    text-align: center;
    font-size: 15px;
    color: #5e35b1;
    line-height: 1.4;
  }
  /* Natiivi videokehys */
  #playerBox {
    display: none;
    background-color: #000;
    text-align: center;
    padding-bottom: 10px;
  }
  #nowPlayingText {
    color: #e1bee7;
    font-size: 13px;
    padding: 6px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #nativePlayer {
    width: 100%;
    max-height: 210px;
    background-color: #000;
  }
  .player-controls {
    margin-top: 6px;
  }
  .player-btn {
    background-color: #6a1b9a;
    color: #fff;
    border: none;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    margin: 0 4px;
  }
  /* Videorivi */
  .video-item {
    background-color: #fff;
    border-bottom: 1px solid #e1d5ec;
    padding: 10px;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
  }
  .video-click-area {
    -webkit-flex: 1;
    flex: 1;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    overflow: hidden;
  }
  .video-click-area:active {
    opacity: 0.7;
  }
  .thumb {
    width: 96px;
    height: 54px;
    background-color: #1a002b;
    margin-right: 10px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 4px;
  }
  .info {
    -webkit-flex: 1;
    flex: 1;
    overflow: hidden;
    padding-right: 6px;
  }
  .v-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
    line-height: 1.25;
    max-height: 35px;
    overflow: hidden;
  }
  .v-meta {
    font-size: 12px;
    color: #6a1b9a;
  }
  .add-btn {
    background-color: #f3e5f5;
    color: #6a1b9a;
    border: 1px solid #ce93d8;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .add-btn:active {
    background-color: #8e24aa;
    color: #fff;
  }
  /* Soittolistanäkymä */
  #playlistsView {
    display: none;
    padding-bottom: 20px;
  }
  .pl-header {
    background-color: #7b1fa2;
    color: #fff;
    padding: 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .pl-card {
    background-color: #fff;
    border-bottom: 1px solid #e1d5ec;
    padding: 14px 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .pl-name {
    font-size: 16px;
    font-weight: bold;
    color: #4a148c;
  }
  .pl-count {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }
  .btn-play-pl {
    background-color: #8e24aa;
    color: #fff;
    border: none;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
    margin-right: 6px;
  }
  .btn-del {
    background-color: #fbe9e7;
    color: #c62828;
    border: 1px solid #ef9a9a;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 6px;
  }
  /* Ponnahdusikkuna soittolistan valintaan */
  #modalOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.65);
    z-index: 100;
    padding: 30px 16px;
  }
  .modal-box {
    background-color: #fff;
    border-radius: 10px;
    max-width: 380px;
    margin: 20px auto;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .modal-title {
    font-size: 16px;
    font-weight: bold;
    color: #4a148c;
    margin-bottom: 12px;
  }
  .modal-list-item {
    padding: 12px;
    border: 1px solid #e1d5ec;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #6a1b9a;
    background-color: #faf5fc;
  }
  .modal-list-item:active {
    background-color: #e1bee7;
  }
  .modal-new-btn {
    width: 100%;
    padding: 12px;
    background-color: #8e24aa;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    margin-top: 4px;
  }
  .modal-cancel-btn {
    width: 100%;
    padding: 10px;
    background-color: #eee;
    color: #333;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">iOS7 Tube</div>
  <div class="nav-tabs">
    <button type="button" id="tabSearch" class="nav-btn active" onclick="switchTab('search')">Haku</button>
    <button type="button" id="tabPlaylists" class="nav-btn" onclick="switchTab('playlists')">Soittolistat</button>
  </div>
</div>

<!-- Sivun sisäinen natiivi videosoitin -->
<div id="playerBox">
  <div id="nowPlayingText"></div>
  <video id="nativePlayer" controls preload="auto"></video>
  <div class="player-controls">
    <button type="button" id="nextTrackBtn" class="player-btn" style="display:none;" onclick="playNextInQueue()">Seuraava &raquo;</button>
    <button type="button" class="player-btn" onclick="closePlayer()">Sulje soitin</button>
  </div>
</div>

<!-- HAKUNÄKYMÄ -->
<div id="searchView">
  <div id="searchWrapper" class="search-wrapper centered">
    <form class="search-box" onsubmit="doSearch(); return false;">
      <input type="text" id="queryInput" placeholder="Hae videoita..." autocomplete="off">
      <button type="submit" class="search-btn">Hae</button>
    </form>
    <div id="status">Kirjoita hakusana ja paina Hae.</div>
  </div>
  <div id="results"></div>
</div>

<!-- SOITTOLISTANÄKYMÄ -->
<div id="playlistsView">
  <div class="pl-header">
    <div id="plHeaderTitle" style="font-weight:bold; font-size:16px;">Omat soittolistat</div>
    <div>
      <button type="button" id="plBackBtn" class="nav-btn" style="display:none;" onclick="renderPlaylistsOverview()">&laquo; Takaisin</button>
      <button type="button" id="plCreateBtn" class="nav-btn active" onclick="createNewPlaylistPrompt()">+ Uusi lista</button>
    </div>
  </div>
  <div id="plStatus" style="padding:12px; text-align:center; color:#5e35b1; font-size:14px; display:none;"></div>
  <div id="playlistsContainer"></div>
</div>

<!-- PONNAHDUKSIKKUNA: LISÄÄ SOITTOLISTALLE -->
<div id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalVideoTitle">Lisää soittolistalle</div>
    <div id="modalPlaylistsList"></div>
    <button type="button" class="modal-new-btn" onclick="addVideoToNewPlaylist()">+ Luo uusi soittolista</button>
    <button type="button" class="modal-cancel-btn" onclick="closeModal()">Peruuta</button>
  </div>
</div>

<script type="text/javascript">
  var WORKER_BASE = "https://ios7proxy.juha-petteri-jarvinen.workers.dev/";
  var currentSearchResults = [];
  var pendingVideoToAdd = null;

  // Soittojono soittolistatoistolle
  var playQueue = [];
  var playQueueIndex = -1;

  // --- LOCALSTORAGE SOITTOLISTAT ---
  function loadPlaylists() {
    try {
      var raw = localStorage.getItem("ios7tube_playlists");
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function savePlaylists(lists) {
    try {
      localStorage.setItem("ios7tube_playlists", JSON.stringify(lists));
    } catch (e) {
      alert("Tallennus epäonnistui. Tarkista ettei Safarin yksityinen selaus ole päällä.");
    }
  }

  // --- VÄLILEHDET ---
  function switchTab(tab) {
    var searchView = document.getElementById("searchView");
    var plView = document.getElementById("playlistsView");
    var tabSearch = document.getElementById("tabSearch");
    var tabPl = document.getElementById("tabPlaylists");

    if (tab === "search") {
      searchView.style.display = "block";
      plView.style.display = "none";
      tabSearch.className = "nav-btn active";
      tabPl.className = "nav-btn";
    } else {
      searchView.style.display = "none";
      plView.style.display = "block";
      tabSearch.className = "nav-btn";
      tabPl.className = "nav-btn active";
      renderPlaylistsOverview();
    }
  }

  // --- SOITIN JA JONO ---
  function closePlayer() {
    var player = document.getElementById("nativePlayer");
    var box = document.getElementById("playerBox");
    try {
      player.pause();
      player.removeAttribute("src");
      player.load();
    } catch (e) {}
    box.style.display = "none";
    playQueue = [];
    playQueueIndex = -1;
  }

  function startNativeVideo(streamUrl, titleText) {
    var box = document.getElementById("playerBox");
    var player = document.getElementById("nativePlayer");
    var nowText = document.getElementById("nowPlayingText");
    var nextBtn = document.getElementById("nextTrackBtn");

    box.style.display = "block";
    nowText.innerHTML = titleText || "Toistetaan videota";

    if (playQueue.length > 1 && playQueueIndex < playQueue.length - 1) {
      nextBtn.style.display = "inline-block";
    } else {
      nextBtn.style.display = "none";
    }

    player.src = streamUrl;
    player.load();
    player.play();

    player.onloadedmetadata = function() {
      try {
        if (player.webkitEnterFullscreen) {
          player.webkitEnterFullscreen();
        }
      } catch (e) {}
    };
  }

  // Kun video loppuu, siirrytään soittolistan seuraavaan videoon
  document.getElementById("nativePlayer").addEventListener("ended", function() {
    if (playQueue.length > 0 && playQueueIndex + 1 < playQueue.length) {
      playNextInQueue();
    }
  }, false);

  function playNextInQueue() {
    if (playQueueIndex + 1 < playQueue.length) {
      playQueueIndex++;
      var nextVid = playQueue[playQueueIndex];
      fetchAndPlayVideo(nextVid.videoId, (playQueueIndex + 1) + "/" + playQueue.length + ": " + nextVid.title, true);
    }
  }

  function playSingleVideo(index) {
    var v = currentSearchResults[index];
    if (!v) return;
    playQueue = [];
    playQueueIndex = -1;
    fetchAndPlayVideo(v.videoId, v.title, false);
  }

  function startPlaylistPlayback(plIndex, startTrackIndex) {
    var lists = loadPlaylists();
    var pl = lists[plIndex];
    if (!pl || !pl.videos || pl.videos.length === 0) return;

    playQueue = pl.videos;
    playQueueIndex = startTrackIndex || 0;
    var vid = playQueue[playQueueIndex];
    fetchAndPlayVideo(vid.videoId, (playQueueIndex + 1) + "/" + playQueue.length + ": " + vid.title, true);
  }

  function fetchAndPlayVideo(videoId, labelText, isPlaylist) {
    var statusEl = isPlaylist ? document.getElementById("plStatus") : document.getElementById("status");
    statusEl.style.display = "block";
    if (!isPlaylist) statusEl.style.color = "#fff";
    statusEl.innerHTML = "Haetaan videovirtaa: " + (labelText || "") + "...";
    window.scrollTo(0, 0);

    var url = WORKER_BASE + "?action=stream&id=" + encodeURIComponent(videoId);
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 25000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.url) {
              statusEl.style.display = "none";
              var finalStreamUrl = data.proxy ? (WORKER_BASE + "?action=proxy&url=" + encodeURIComponent(data.url)) : data.url;
              startNativeVideo(finalStreamUrl, labelText);
            } else {
              statusEl.innerHTML = data.error || "Videovirtaa ei löytynyt.";
            }
          } catch (e) {
            statusEl.innerHTML = "Virhe videon tietojen purkamisessa.";
          }
        } else {
          statusEl.innerHTML = "Videon lataus epäonnistui (" + xhr.status + ").";
        }
      }
    };

    xhr.onerror = function() {
      statusEl.innerHTML = "Yhteysvirhe videovirtaa haettaessa.";
    };

    xhr.send();
  }

  // --- HAKU ---
  function doSearch() {
    var q = document.getElementById("queryInput").value;
    if (!q || q.replace(/\s/g, "") === "") return;

    document.getElementById("queryInput").blur();
    document.getElementById("searchWrapper").className = "search-wrapper compact";

    var statusEl = document.getElementById("status");
    var resultsEl = document.getElementById("results");
    statusEl.style.display = "block";
    statusEl.style.color = "#fff";
    statusEl.innerHTML = "Haetaan videoita...";
    resultsEl.innerHTML = "";

    var url = WORKER_BASE + "?action=search&q=" + encodeURIComponent(q);
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 20000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var videos = JSON.parse(xhr.responseText);
            currentSearchResults = videos || [];
            renderResults(currentSearchResults);
          } catch (e) {
            statusEl.innerHTML = "Virhe hakutulosten lukemisessa.";
          }
        } else {
          statusEl.innerHTML = "Hakuvirhe (" + xhr.status + ").";
        }
      }
    };

    xhr.onerror = function() {
      statusEl.innerHTML = "Yhteysvirhe Workeriin.";
    };

    xhr.send();
  }

  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderResults(videos) {
    var statusEl = document.getElementById("status");
    var resultsEl = document.getElementById("results");

    if (!videos || videos.length === 0) {
      statusEl.innerHTML = "Ei hakutuloksia.";
      return;
    }

    statusEl.style.display = "none";
    var html = "";

    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      if (!v.videoId) continue;

      var title = escapeHtml(v.title || "Nimetön");
      var author = escapeHtml(v.author || "");
      var dur = escapeHtml(v.duration || "");

      html += '<div class="video-item">';
      html += '<div class="video-click-area" onclick="playSingleVideo(' + i + ')">';
      if (v.thumb) {
        html += '<img class="thumb" src="' + v.thumb + '" alt="">';
      }
      html += '<div class="info">';
      html += '<div class="v-title">' + title + '</div>';
      html += '<div class="v-meta">' + author + (dur ? ' &bull; ' + dur : '') + '</div>';
      html += '</div></div>';
      html += '<button type="button" class="add-btn" onclick="openAddModal(' + i + ')">+ Lista</button>';
      html += '</div>';
    }

    resultsEl.innerHTML = html;
  }

  // --- SOITTOLISTALLE LISÄYS (MODAL) ---
  function openAddModal(searchIndex) {
    pendingVideoToAdd = currentSearchResults[searchIndex];
    if (!pendingVideoToAdd) return;

    document.getElementById("modalVideoTitle").innerHTML = "Lisää: " + escapeHtml(pendingVideoToAdd.title);
    var lists = loadPlaylists();
    var container = document.getElementById("modalPlaylistsList");
    var html = "";

    if (lists.length === 0) {
      html = '<div style="font-size:13px; color:#666; margin-bottom:10px;">Ei vielä soittolistoja. Luo ensimmäinen alta:</div>';
    } else {
      for (var i = 0; i < lists.length; i++) {
        html += '<div class="modal-list-item" onclick="confirmAddToPlaylist(' + i + ')">';
        html += escapeHtml(lists[i].name) + ' (' + lists[i].videos.length + ' kpl)';
        html += '</div>';
      }
    }

    container.innerHTML = html;
    document.getElementById("modalOverlay").style.display = "block";
  }

  function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
    pendingVideoToAdd = null;
  }

  function confirmAddToPlaylist(plIndex) {
    if (!pendingVideoToAdd) return;
    var lists = loadPlaylists();
    if (!lists[plIndex]) return;

    lists[plIndex].videos.push({
      videoId: pendingVideoToAdd.videoId,
      title: pendingVideoToAdd.title,
      author: pendingVideoToAdd.author,
      duration: pendingVideoToAdd.duration,
      thumb: pendingVideoToAdd.thumb
    });

    savePlaylists(lists);
    var listName = lists[plIndex].name;
    closeModal();
    alert("Lisätty listalle: " + listName);
  }

  function addVideoToNewPlaylist() {
    var name = prompt("Anna uuden soittolistan nimi:");
    if (!name || name.replace(/\s/g, "") === "") return;

    var lists = loadPlaylists();
    lists.push({ name: name, videos: [] });
    savePlaylists(lists);
    confirmAddToPlaylist(lists.length - 1);
  }

  // --- SOITTOLISTOJEN HALLINTA ---
  function createNewPlaylistPrompt() {
    var name = prompt("Anna uuden soittolistan nimi:");
    if (!name || name.replace(/\s/g, "") === "") return;

    var lists = loadPlaylists();
    lists.push({ name: name, videos: [] });
    savePlaylists(lists);
    renderPlaylistsOverview();
  }

  function deletePlaylist(plIndex) {
    var lists = loadPlaylists();
    if (!lists[plIndex]) return;
    if (confirm("Poistetaanko soittolista \"" + lists[plIndex].name + "\"?")) {
      lists.splice(plIndex, 1);
      savePlaylists(lists);
      renderPlaylistsOverview();
    }
  }

  function removeVideoFromPlaylist(plIndex, trackIndex) {
    var lists = loadPlaylists();
    if (!lists[plIndex]) return;
    lists[plIndex].videos.splice(trackIndex, 1);
    savePlaylists(lists);
    openPlaylistDetails(plIndex);
  }

  function renderPlaylistsOverview() {
    document.getElementById("plHeaderTitle").innerHTML = "Omat soittolistat";
    document.getElementById("plBackBtn").style.display = "none";
    document.getElementById("plCreateBtn").style.display = "inline-block";
    document.getElementById("plStatus").style.display = "none";

    var lists = loadPlaylists();
    var container = document.getElementById("playlistsContainer");

    if (lists.length === 0) {
      container.innerHTML = '<div style="padding:30px 16px; text-align:center; color:#666; font-size:15px;">Sinulla ei ole vielä soittolistoja.<br><br>Hae videoita ja paina <b>+ Lista</b> lisätäksesi niitä soittolistalle.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < lists.length; i++) {
      var pl = lists[i];
      html += '<div class="pl-card">';
      html += '<div style="flex:1; overflow:hidden; padding-right:8px;" onclick="openPlaylistDetails(' + i + ')">';
      html += '<div class="pl-name">' + escapeHtml(pl.name) + '</div>';
      html += '<div class="pl-count">' + pl.videos.length + ' videota &bull; Napauta avataksesi</div>';
      html += '</div>';
      html += '<div>';
      if (pl.videos.length > 0) {
        html += '<button type="button" class="btn-play-pl" onclick="startPlaylistPlayback(' + i + ', 0)">Toista</button>';
      }
      html += '<button type="button" class="btn-del" onclick="deletePlaylist(' + i + ')">Poista</button>';
      html += '</div></div>';
    }

    container.innerHTML = html;
  }

  function openPlaylistDetails(plIndex) {
    var lists = loadPlaylists();
    var pl = lists[plIndex];
    if (!pl) return;

    document.getElementById("plHeaderTitle").innerHTML = escapeHtml(pl.name);
    document.getElementById("plBackBtn").style.display = "inline-block";
    document.getElementById("plCreateBtn").style.display = "none";

    var container = document.getElementById("playlistsContainer");
    if (pl.videos.length === 0) {
      container.innerHTML = '<div style="padding:30px 16px; text-align:center; color:#666;">Tämä soittolista on tyhjä.</div>';
      return;
    }

    var html = '<div style="padding:10px; background:#ede7f6; text-align:center;">';
    html += '<button type="button" class="btn-play-pl" style="width:100%; padding:12px; font-size:15px;" onclick="startPlaylistPlayback(' + plIndex + ', 0)">Toista koko soittolista (' + pl.videos.length + ' kpl)</button>';
    html += '</div>';

    for (var j = 0; j < pl.videos.length; j++) {
      var v = pl.videos[j];
      html += '<div class="video-item">';
      html += '<div class="video-click-area" onclick="startPlaylistPlayback(' + plIndex + ', ' + j + ')">';
      if (v.thumb) {
        html += '<img class="thumb" src="' + v.thumb + '" alt="">';
      }
      html += '<div class="info">';
      html += '<div class="v-title">' + (j + 1) + '. ' + escapeHtml(v.title) + '</div>';
      html += '<div class="v-meta">' + escapeHtml(v.author) + (v.duration ? ' &bull; ' + escapeHtml(v.duration) : '') + '</div>';
      html += '</div></div>';
      html += '<button type="button" class="btn-del" onclick="removeVideoFromPlaylist(' + plIndex + ', ' + j + ')">X</button>';
      html += '</div>';
    }

    container.innerHTML = html;
  }
</script>

</body>
</html>
