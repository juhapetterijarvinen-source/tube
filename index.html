<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iOS7 Tube">
<title>iOS7 Tube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: #f4eff8;
    color: #111;
    -webkit-text-size-adjust: none;
  }
  .top-bar {
    background-color: #6a1b9a;
    color: #fff;
    padding: 10px 12px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.3px;
  }
  select {
    font-size: 12px;
    padding: 5px 6px;
    border-radius: 5px;
    border: none;
    background: #fff;
    color: #4a148c;
    font-weight: bold;
    max-width: 175px;
  }
  /* Alkunäkymä: hakukenttä keskellä ruutua */
  .search-wrapper.centered {
    padding: 75px 18px 20px 18px;
    text-align: center;
  }
  /* Hakutulosnäkymä: hakukenttä tiiviinä ylhäällä */
  .search-wrapper.compact {
    background-color: #7b1fa2;
    padding: 10px 12px;
  }
  .search-box {
    display: -webkit-flex;
    display: flex;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 3px 10px rgba(74, 20, 140, 0.18);
    border-radius: 8px;
  }
  input[type="text"] {
    -webkit-flex: 1;
    flex: 1;
    font-size: 19px;
    padding: 14px 12px;
    border: 2px solid #8e24aa;
    border-right: none;
    border-radius: 8px 0 0 8px;
    outline: none;
    background-color: #fff;
    color: #111;
  }
  .compact input[type="text"] {
    font-size: 17px;
    padding: 10px 12px;
    border: none;
  }
  button.search-btn {
    background-color: #8e24aa;
    color: #fff;
    border: 2px solid #8e24aa;
    padding: 14px 18px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 0 8px 8px 0;
  }
  .compact button.search-btn {
    background-color: #4a148c;
    border: none;
    padding: 10px 16px;
    font-size: 16px;
  }
  button.search-btn:active {
    background-color: #4a148c;
  }
  #status {
    padding: 14px 18px;
    text-align: center;
    font-size: 15px;
    color: #5e35b1;
    line-height: 1.4;
  }
  .video-item {
    background-color: #fff;
    border-bottom: 1px solid #e1d5ec;
    padding: 10px;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
  }
  .video-item:active {
    background-color: #ede7f6;
  }
  .thumb {
    width: 100px;
    height: 56px;
    background-color: #1a002b;
    margin-right: 10px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 4px;
  }
  .info {
    -webkit-flex: 1;
    flex: 1;
    overflow: hidden;
  }
  .v-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
    line-height: 1.25;
    max-height: 35px;
    overflow: hidden;
  }
  .v-meta {
    font-size: 12px;
    color: #6a1b9a;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">iOS7 Tube</div>
  <select id="instanceSelect">
    <option value="https://pipedapi.kavin.rocks">Piped (kavin.rocks)</option>
    <option value="https://pipedapi.adminforge.de">Piped (adminforge.de)</option>
    <option value="https://api.piped.projectsegfau.lt">Piped (projectsegfau.lt)</option>
    <option value="PROXY_INVIDIOUS">Invidious + CORS-proxy</option>
  </select>
</div>

<div id="searchWrapper" class="search-wrapper centered">
  <form class="search-box" onsubmit="doSearch(); return false;">
    <input type="text" id="queryInput" placeholder="Hae videoita..." autocomplete="off">
    <button type="submit" class="search-btn">Hae</button>
  </form>
  <div id="status">Kirjoita hakusana ja paina Hae.</div>
</div>

<div id="results"></div>

<script type="text/javascript">
  function getSelectedMode() {
    var sel = document.getElementById("instanceSelect");
    return sel.options[sel.selectedIndex].value;
  }

  function formatDuration(sec) {
    if (!sec || sec < 0) return "LIVE";
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function extractVideoId(urlOrId) {
    if (!urlOrId) return "";
    if (urlOrId.indexOf("v=") !== -1) {
      return urlOrId.split("v=")[1].split("&")[0];
    }
    return urlOrId;
  }

  function doSearch() {
    var q = document.getElementById("queryInput").value;
    if (!q || q.replace(/\s/g, "") === "") return;

    document.getElementById("queryInput").blur();
    document.getElementById("searchWrapper").className = "search-wrapper compact";

    var statusEl = document.getElementById("status");
    var resultsEl = document.getElementById("results");
    statusEl.style.display = "block";
    statusEl.style.color = "#fff";
    statusEl.innerHTML = "Haetaan videoita...";
    resultsEl.innerHTML = "";

    var mode = getSelectedMode();
    var url = "";

    if (mode === "PROXY_INVIDIOUS") {
      var target = "https://inv.nadeko.net/api/v1/search?q=" + encodeURIComponent(q) + "&type=video";
      url = "https://corsproxy.io/?" + encodeURIComponent(target);
    } else {
      url = mode + "/search?q=" + encodeURIComponent(q) + "&filter=videos";
    }

    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 18000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var items = (mode === "PROXY_INVIDIOUS") ? data : (data.items || []);
            renderResults(items, mode);
          } catch (e) {
            statusEl.innerHTML = "Virhe: Palvelimen vastaus ei kelpaa. Vaihda palvelinta yläkulmasta.";
          }
        } else {
          statusEl.innerHTML = "Yhteysvirhe (" + xhr.status + "). Vaihda toinen palvelin yläkulmasta.";
        }
      }
    };

    xhr.onerror = function() {
      statusEl.innerHTML = "TLS/Verkkovirhe tällä palvelimella. Kokeile valikosta toista palvelinta (esim. adminforge tai CORS-proxy).";
    };

    xhr.send();
  }

  function renderResults(videos, mode) {
    var statusEl = document.getElementById("status");
    var resultsEl = document.getElementById("results");

    if (!videos || videos.length === 0) {
      statusEl.innerHTML = "Ei hakutuloksia.";
      return;
    }

    statusEl.style.display = "none";
    var html = "";

    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      var videoId = "";
      var thumbUrl = "";
      var title = "";
      var author = "";
      var dur = "";

      if (mode === "PROXY_INVIDIOUS") {
        videoId = v.videoId;
        if (v.videoThumbnails && v.videoThumbnails.length > 0) {
          thumbUrl = v.videoThumbnails[0].url;
        }
        title = v.title || "Nimetön";
        author = v.author || "";
        dur = formatDuration(v.lengthSeconds);
      } else {
        videoId = extractVideoId(v.url);
        thumbUrl = v.thumbnail || "";
        title = v.title || "Nimetön";
        author = v.uploaderName || "";
        dur = formatDuration(v.duration);
      }

      if (!videoId) continue;

      title = title.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      author = author.replace(/</g, "&lt;").replace(/>/g, "&gt;");

      html += '<div class="video-item" onclick="playVideo(\'' + videoId + '\')">';
      if (thumbUrl) {
        html += '<img class="thumb" src="' + thumbUrl + '" alt="">';
      }
      html += '<div class="info">';
      html += '<div class="v-title">' + title + '</div>';
      html += '<div class="v-meta">' + author + ' &bull; ' + dur + '</div>';
      html += '</div></div>';
    }

    resultsEl.innerHTML = html;
  }

  function playVideo(videoId) {
    var statusEl = document.getElementById("status");
    statusEl.style.display = "block";
    statusEl.style.color = "#fff";
    statusEl.innerHTML = "Haetaan videovirtaa...";
    window.scrollTo(0, 0);

    var mode = getSelectedMode();
    var url = "";

    if (mode === "PROXY_INVIDIOUS") {
      var target = "https://inv.nadeko.net/api/v1/videos/" + encodeURIComponent(videoId);
      url = "https://corsproxy.io/?" + encodeURIComponent(target);
    } else {
      url = mode + "/streams/" + encodeURIComponent(videoId);
    }

    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 18000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var mp4Url = null;

            if (mode === "PROXY_INVIDIOUS") {
              var streams = data.formatStreams || [];
              for (var i = 0; i < streams.length; i++) {
                if (streams[i].container === "mp4" && streams[i].url) {
                  mp4Url = streams[i].url;
                  if (streams[i].qualityLabel && streams[i].qualityLabel.indexOf("360p") === 0) break;
                }
              }
            } else {
              var vStreams = data.videoStreams || [];
              for (var j = 0; j < vStreams.length; j++) {
                if (vStreams[j].format === "MPEG_4" && vStreams[j].videoOnly === false && vStreams[j].url) {
                  mp4Url = vStreams[j].url;
                  if (vStreams[j].quality === "360p") break;
                }
              }
            }

            if (mp4Url) {
              statusEl.style.display = "none";
              window.location.href = mp4Url;
            } else {
              statusEl.innerHTML = "Suoraa MP4-virtaa ei löytynyt. Kokeile vaihtaa palvelinta yläkulmasta.";
            }
          } catch (e) {
            statusEl.innerHTML = "Virhe videon tietojen purkamisessa.";
          }
        } else {
          statusEl.innerHTML = "Videon lataus epäonnistui (" + xhr.status + ").";
        }
      }
    };

    xhr.onerror = function() {
      statusEl.innerHTML = "Verkkovirhe videota avatessa. Kokeile toista palvelinta.";
    };

    xhr.send();
  }
</script>

</body>
</html>
