<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iOS7 Tube">
<title>iOS7 Tube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: #f4eff8;
    color: #111;
    -webkit-text-size-adjust: none;
  }
  .top-bar {
    background-color: #6a1b9a;
    color: #fff;
    padding: 10px 14px;
    text-align: center;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.4px;
  }
  .search-wrapper.centered {
    padding: 75px 18px 20px 18px;
    text-align: center;
  }
  .search-wrapper.compact {
    background-color: #7b1fa2;
    padding: 10px 12px;
  }
  .search-box {
    display: -webkit-flex;
    display: flex;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 3px 10px rgba(74, 20, 140, 0.18);
    border-radius: 8px;
  }
  input[type="text"] {
    -webkit-flex: 1;
    flex: 1;
    font-size: 19px;
    padding: 14px 12px;
    border: 2px solid #8e24aa;
    border-right: none;
    border-radius: 8px 0 0 8px;
    outline: none;
    background-color: #fff;
    color: #111;
  }
  .compact input[type="text"] {
    font-size: 17px;
    padding: 10px 12px;
    border: none;
  }
  button.search-btn {
    background-color: #8e24aa;
    color: #fff;
    border: 2px solid #8e24aa;
    padding: 14px 18px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 0 8px 8px 0;
  }
  .compact button.search-btn {
    background-color: #4a148c;
    border: none;
    padding: 10px 16px;
    font-size: 16px;
  }
  button.search-btn:active {
    background-color: #4a148c;
  }
  #status {
    padding: 14px 18px;
    text-align: center;
    font-size: 15px;
    color: #5e35b1;
    line-height: 1.4;
  }
  .video-item {
    background-color: #fff;
    border-bottom: 1px solid #e1d5ec;
    padding: 10px;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
  }
  .video-item:active {
    background-color: #ede7f6;
  }
  .thumb {
    width: 100px;
    height: 56px;
    background-color: #1a002b;
    margin-right: 10px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 4px;
  }
  .info {
    -webkit-flex: 1;
    flex: 1;
    overflow: hidden;
  }
  .v-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
    line-height: 1.25;
    max-height: 35px;
    overflow: hidden;
  }
  .v-meta {
    font-size: 12px;
    color: #6a1b9a;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">iOS7 Tube</div>
</div>

<div id="searchWrapper" class="search-wrapper centered">
  <form class="search-box" onsubmit="doSearch(); return false;">
    <input type="text" id="queryInput" placeholder="Hae videoita..." autocomplete="off">
    <button type="submit" class="search-btn">Hae</button>
  </form>
  <div id="status">Kirjoita hakusana ja paina Hae.</div>
</div>

<div id="results"></div>

<script type="text/javascript">
  var WORKER_BASE = "https://ios7proxy.juha-petteri-jarvinen.workers.dev/";

  function doSearch() {
    var q = document.getElementById("queryInput").value;
    if (!q || q.replace(/\s/g, "") === "") return;

    document.getElementById("queryInput").blur();
    document.getElementById("searchWrapper").className = "search-wrapper compact";

    var statusEl = document.getElementById("status");
    var resultsEl = document.getElementById("results");
    statusEl.style.display = "block";
    statusEl.style.color = "#fff";
    statusEl.innerHTML = "Haetaan videoita...";
    resultsEl.innerHTML = "";

    var url = WORKER_BASE + "?action=search&q=" + encodeURIComponent(q);
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 20000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var videos = JSON.parse(xhr.responseText);
            renderResults(videos);
          } catch (e) {
            statusEl.innerHTML = "Virhe hakutulosten lukemisessa.";
          }
        } else {
          statusEl.innerHTML = "Hakuvirhe (" + xhr.status + ").";
        }
      }
    };

    xhr.onerror = function() {
      statusEl.innerHTML = "Yhteysvirhe Workeriin.";
    };

    xhr.send();
  }

  function renderResults(videos) {
    var statusEl = document.getElementById("status");
    var resultsEl = document.getElementById("results");

    if (!videos || videos.length === 0) {
      statusEl.innerHTML = "Ei hakutuloksia.";
      return;
    }

    statusEl.style.display = "none";
    var html = "";

    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      if (!v.videoId) continue;

      var title = (v.title || "Nimetön").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      var author = (v.author || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      var dur = v.duration || "";

      html += '<div class="video-item" onclick="playVideo(\'' + v.videoId + '\')">';
      if (v.thumb) {
        html += '<img class="thumb" src="' + v.thumb + '" alt="">';
      }
      html += '<div class="info">';
      html += '<div class="v-title">' + title + '</div>';
      html += '<div class="v-meta">' + author + (dur ? ' &bull; ' + dur : '') + '</div>';
      html += '</div></div>';
    }

    resultsEl.innerHTML = html;
  }

  function playVideo(videoId) {
    var statusEl = document.getElementById("status");
    statusEl.style.display = "block";
    statusEl.style.color = "#fff";
    statusEl.innerHTML = "Haetaan videovirtaa...";
    window.scrollTo(0, 0);

    var url = WORKER_BASE + "?action=stream&id=" + encodeURIComponent(videoId);
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 25000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.url) {
              statusEl.style.display = "none";
              window.location.href = data.url;
            } else {
              statusEl.innerHTML = data.error || "Videovirtaa ei löytynyt.";
            }
          } catch (e) {
            statusEl.innerHTML = "Virhe videon tietojen purkamisessa.";
          }
        } else {
          statusEl.innerHTML = "Videon lataus epäonnistui (" + xhr.status + ").";
        }
      }
    };

    xhr.onerror = function() {
      statusEl.innerHTML = "Yhteysvirhe videovirtaa haettaessa.";
    };

    xhr.send();
  }
</script>

</body>
</html>
